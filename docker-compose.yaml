services:
  scenesmith:
    build: .
    runtime: nvidia
    environment:
      # Keep provider envs explicit for SceneSmith config.
      - SCENESMITH_VLM_API_KEY=${SCENESMITH_VLM_API_KEY:-}
      - SCENESMITH_VLM_BASE_URL=${SCENESMITH_VLM_BASE_URL:-https://api.openai.com/v1}
      - SCENESMITH_IMAGE_API_KEY=${SCENESMITH_IMAGE_API_KEY:-}
      - SCENESMITH_IMAGE_BASE_URL=${SCENESMITH_IMAGE_BASE_URL:-https://api.openai.com/v1}
      - SCENESMITH_GEMINI_API_KEY=${SCENESMITH_GEMINI_API_KEY:-}
      - SCENESMITH_GEMINI_BASE_URL=${SCENESMITH_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - SCENESMITH_GEMINI_IMAGE_MODEL=${SCENESMITH_GEMINI_IMAGE_MODEL:-gemini-3-pro-image-preview}
      # Bridge variables expected by some SDK paths.
      - OPENAI_API_KEY=${SCENESMITH_VLM_API_KEY:-}
      - OPENAI_BASE_URL=${SCENESMITH_VLM_BASE_URL:-https://api.openai.com/v1}
      - GOOGLE_API_KEY=${SCENESMITH_GEMINI_API_KEY:-}
      - OPENAI_TRACING_KEY=${OPENAI_TRACING_KEY:-}
      - NVIDIA_VISIBLE_DEVICES=all
      # Persist HuggingFace cache across container runs to prevent repeated
      # model bootstrap failures in geometry workers (e.g., MoGe preload).
      - HF_HOME=/app/data/hf_cache
      - HUGGINGFACE_HUB_CACHE=/app/data/hf_cache/hub
      - TRANSFORMERS_CACHE=/app/data/hf_cache/transformers
      - HF_HUB_ETAG_TIMEOUT=${HF_HUB_ETAG_TIMEOUT:-60}
      - HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-1200}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      # Data directories (download on host, mount into container).
      - ./data:/app/data
      # SAM3D model checkpoints (requires HuggingFace auth).
      - ./external/checkpoints:/app/external/checkpoints
      # Generated scene outputs.
      - ./outputs:/app/outputs
    # Required for bubblewrap (GPU isolation for multi-GPU Blender rendering).
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
