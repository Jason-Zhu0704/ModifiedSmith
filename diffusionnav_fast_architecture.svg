<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1180" viewBox="0 0 2100 1180">
  <defs>
    <style>
      .t{font:700 30px Arial,sans-serif;fill:#173fa8}
      .h{font:700 22px Arial,sans-serif;fill:#173fa8}
      .b{font:500 18px Arial,sans-serif;fill:#1f1f1f}
      .s{font:500 15px Arial,sans-serif;fill:#1f1f1f}
    </style>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#1f4fc1"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#f06b00"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#138a24"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#6f30c6"/></marker>
    <marker id="ak" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#111"/></marker>
  </defs>

  <rect width="2100" height="1180" fill="#f7f8fa"/>

  <g id="col1-inputs">
    <rect x="8" y="8" width="355" height="1000" rx="12" fill="#f6faff" stroke="#6a9af7"/>
    <text x="185" y="46" text-anchor="middle" class="t">① Inputs</text>
    <text x="30" y="84" class="h">(a) RGB History (3 frames)</text>
    <rect x="78" y="104" width="240" height="75" fill="#ddd" stroke="#888"/>
    <rect x="78" y="191" width="240" height="75" fill="#ddd" stroke="#888"/>
    <rect x="78" y="278" width="240" height="75" fill="#ddd" stroke="#888"/>
    <text x="24" y="145" class="h" fill="#333">t-2</text><text x="24" y="232" class="h" fill="#333">t-1</text><text x="24" y="319" class="h" fill="#333">t</text>

    <text x="30" y="402" class="h">(b) Depth History (3 frames)</text>
    <rect x="78" y="421" width="240" height="65" fill="#777" stroke="#555"/>
    <rect x="78" y="497" width="240" height="65" fill="#777" stroke="#555"/>
    <rect x="78" y="573" width="240" height="65" fill="#777" stroke="#555"/>
    <text x="24" y="460" class="h" fill="#333">t-2</text><text x="24" y="536" class="h" fill="#333">t-1</text><text x="24" y="612" class="h" fill="#333">t</text>

    <text x="30" y="686" class="h">(c) Optional Local Costmap</text>
    <rect x="72" y="705" width="160" height="140" fill="#ffd65a" stroke="#777"/>
    <text x="245" y="724" class="s">High cost</text><text x="270" y="838" class="s">Low cost</text>

    <text x="30" y="902" class="h">(d) Local Goal (x, y, yaw)</text>
    <rect x="126" y="920" width="70" height="70" rx="8" fill="#ece2ff" stroke="#8a63d2"/>
    <text x="161" y="965" text-anchor="middle" class="h" fill="#6f30c6">★</text>
  </g>

  <g id="col2-encoder">
    <rect x="375" y="8" width="620" height="1000" rx="12" fill="#f6faff" stroke="#6a9af7"/>
    <text x="685" y="46" text-anchor="middle" class="t">② Multimodal Encoder</text>
    <text x="685" y="102" text-anchor="middle" class="t" font-size="24">RGB Backbone (ResNet34/50)</text>

    <g id="stages" transform="translate(430,145)">
      <rect x="0" y="45" width="110" height="100" fill="#dce9ff" stroke="#2c5dc0"/><text x="55" y="105" text-anchor="middle" class="b">64 ch</text>
      <rect x="150" y="55" width="95" height="90" fill="#bdd6ff" stroke="#2c5dc0"/><text x="198" y="106" text-anchor="middle" class="b">128 ch</text>
      <rect x="300" y="65" width="85" height="80" fill="#8bb4ff" stroke="#2c5dc0"/><text x="343" y="108" text-anchor="middle" class="b" fill="#fff">256 ch</text>
      <rect x="435" y="75" width="75" height="70" fill="#5f97ff" stroke="#2c5dc0"/><text x="473" y="112" text-anchor="middle" class="b" fill="#fff">512 ch</text>
      <path d="M110 95h35 M245 100h35 M385 103h35" stroke="#1f4fc1" stroke-width="4" marker-end="url(#ab)"/>
    </g>

    <g id="depth-branch" transform="translate(405,470)">
      <rect x="0" y="0" width="560" height="145" rx="12" fill="#fff6ed" stroke="#f06b00"/>
      <text x="280" y="32" text-anchor="middle" class="h" fill="#f06b00">Depth Branch</text>
      <rect x="34" y="52" width="78" height="68" fill="#ffd7b0" stroke="#f06b00"/>
      <rect x="184" y="62" width="72" height="58" fill="#ffc893" stroke="#f06b00"/>
      <rect x="335" y="70" width="62" height="50" fill="#ffb976" stroke="#f06b00"/>
      <rect x="470" y="76" width="52" height="44" fill="#ffaa59" stroke="#f06b00"/>
      <path d="M112 85h55 M256 90h55 M397 94h55" stroke="#f06b00" stroke-width="4" marker-end="url(#ao)"/>
    </g>

    <g id="costmap-branch" transform="translate(405,640)">
      <rect x="0" y="0" width="560" height="130" rx="12" fill="#eefbec" stroke="#138a24"/>
      <text x="280" y="30" text-anchor="middle" class="h" fill="#138a24">Costmap Branch (optional)</text>
      <rect x="34" y="47" width="92" height="62" fill="#bde8c1" stroke="#138a24"/>
      <rect x="184" y="56" width="82" height="53" fill="#a2dca8" stroke="#138a24"/>
      <rect x="335" y="66" width="62" height="43" fill="#8bd194" stroke="#138a24"/>
      <rect x="470" y="70" width="50" height="39" fill="#77c883" stroke="#138a24"/>
      <path d="M126 79h50 M266 82h50 M397 84h50" stroke="#138a24" stroke-width="4" marker-end="url(#ag)"/>
    </g>
  </g>

  <g id="col3-token-diffusion">
    <rect x="1008" y="8" width="570" height="1000" rx="12" fill="#f6faff" stroke="#6a9af7"/>
    <text x="1293" y="46" text-anchor="middle" class="t">③ Tokenization &amp; Anchor-conditioned</text>
    <text x="1293" y="80" text-anchor="middle" class="t">Truncated Diffusion Head</text>

    <text x="1038" y="175" class="h" fill="#222">Fused Spatial</text><text x="1038" y="206" class="h" fill="#222">Visual Tokens</text>
    <g transform="translate(1045,228)">
      <rect x="0" y="0" width="90" height="130" fill="#eaf2ff" stroke="#6a9af7"/>
      <rect x="0" y="146" width="90" height="70" fill="#eaf2ff" stroke="#6a9af7"/>
      <rect x="0" y="228" width="90" height="90" fill="#eaf2ff" stroke="#6a9af7"/>
    </g>

    <rect x="1280" y="128" width="250" height="280" rx="14" fill="#f8f1ff" stroke="#8a63d2"/>
    <text x="1405" y="162" text-anchor="middle" class="h" fill="#6f30c6">64 Trajectory Anchors</text>
    <text x="1405" y="190" text-anchor="middle" class="h" fill="#6f30c6">+ truncated noise</text>

    <rect x="1260" y="480" width="270" height="310" rx="20" fill="#e9eff8" stroke="#7c9ad0"/>
    <text x="1395" y="590" text-anchor="middle" class="t" font-size="24">Transformer Decoder /</text>
    <text x="1395" y="625" text-anchor="middle" class="t" font-size="24">Diffusion Head</text>

    <rect x="1028" y="720" width="190" height="185" rx="12" fill="#f7f3ff" stroke="#8a63d2"/>
    <text x="1123" y="750" text-anchor="middle" class="h" fill="#222">Goal Token</text>
    <rect x="1048" y="770" width="150" height="40" rx="10" fill="#efe4ff" stroke="#8a63d2"/>
    <text x="1123" y="798" text-anchor="middle" class="h" fill="#6f30c6">Goal MLP</text>
    <rect x="1080" y="824" width="86" height="68" rx="8" fill="#efe4ff" stroke="#8a63d2"/>
    <text x="1123" y="867" text-anchor="middle" class="h" fill="#6f30c6">★</text>
  </g>

  <g id="col4-outputs">
    <rect x="1588" y="8" width="504" height="1000" rx="12" fill="#f6faff" stroke="#6a9af7"/>
    <text x="1840" y="46" text-anchor="middle" class="t">④ Outputs &amp; Self-conditioning</text>
    <rect x="1620" y="72" width="430" height="170" rx="12" fill="#fff" stroke="#9a9a9a"/><text x="1835" y="98" text-anchor="middle" class="h" fill="#222">64 Candidate Trajectories</text>
    <rect x="1620" y="252" width="430" height="90" rx="12" fill="#fff" stroke="#9a9a9a"/><text x="1835" y="284" text-anchor="middle" class="h" fill="#222">Anchor Classification Logits</text>
    <rect x="1620" y="352" width="430" height="110" rx="12" fill="#fff" stroke="#9a9a9a"/><text x="1835" y="386" text-anchor="middle" class="h" fill="#222">Weighted Stop Probability</text>
    <rect x="1620" y="472" width="430" height="90" rx="12" fill="#fff" stroke="#9a9a9a"/><text x="1835" y="504" text-anchor="middle" class="h" fill="#222">Best Trajectory</text>
    <rect x="1620" y="582" width="220" height="180" rx="12" fill="#fff" stroke="#9a9a9a"/><text x="1730" y="612" text-anchor="middle" class="h" fill="#222">Aux Depth</text>
    <rect x="1860" y="582" width="190" height="180" rx="12" fill="#fff" stroke="#9a9a9a"/><text x="1955" y="612" text-anchor="middle" class="h" fill="#222">Aux Costmap</text>
  </g>

  <g id="flows" fill="none" stroke-width="5">
    <path d="M332 237H430" stroke="#1f4fc1" marker-end="url(#ab)"/>
    <path d="M332 554H405" stroke="#f06b00" marker-end="url(#ao)"/>
    <path d="M332 728H405" stroke="#138a24" marker-end="url(#ag)"/>
    <path d="M985 250V930" stroke="#1f4fc1" marker-end="url(#ab)"/>
    <path d="M1138 780H1260" stroke="#6f30c6" marker-end="url(#ap)"/>
    <path d="M1530 635H1620" stroke="#111" marker-end="url(#ak)"/>
    <path d="M1900 762C1900 850,1450 860,1480 800" stroke="#138a24" marker-end="url(#ag)"/>
  </g>

  <g id="legend">
    <rect x="220" y="1030" width="1680" height="70" rx="10" fill="#fefefe" stroke="#6b7d9d" stroke-dasharray="6 4"/>
    <line x1="250" y1="1065" x2="310" y2="1065" stroke="#1f4fc1" stroke-width="5" marker-end="url(#ab)"/><text x="330" y="1072" class="b">Main RGB / fused feature flow</text>
    <line x1="640" y1="1065" x2="700" y2="1065" stroke="#f06b00" stroke-width="5" marker-end="url(#ao)"/><text x="720" y="1072" class="b">Depth branch flow</text>
    <line x1="965" y1="1065" x2="1025" y2="1065" stroke="#138a24" stroke-width="5" marker-end="url(#ag)"/><text x="1045" y="1072" class="b">Costmap / self-conditioning flow</text>
    <line x1="1370" y1="1065" x2="1430" y2="1065" stroke="#6f30c6" stroke-width="5" marker-end="url(#ap)"/><text x="1450" y="1072" class="b">Token / query flow</text>
  </g>

  <text x="1050" y="1150" text-anchor="middle" style="font:700 48px 'Times New Roman',serif;fill:#151515">Figure 1. <tspan style="font-weight:400">Updated overview of the DiffusionNav-Fast architecture.</tspan></text>
</svg>
